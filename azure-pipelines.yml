trigger:
- main

pool:
  name: Default

steps:

- checkout: self

- task: AzureKeyVault@2
  displayName: 'Retrieve secrets from Azure Key Vault'
  inputs:
    azureSubscription: 'azure-appservice-connection'
    KeyVaultName: 'sharayu-devops-kv'
    SecretsFilter: 'demo-secret'
    RunAsPreJob: false

- powershell: |
    if ([string]::IsNullOrWhiteSpace("$(demo-secret)")) {
      Write-Error "Key Vault secret was not retrieved."
      exit 1
    }

    Write-Host "Key Vault secret retrieved successfully."
  displayName: 'Verify Key Vault access'

- script: |
    echo "Checking Terraform configuration..."
    cd terraform
    terraform init -backend=false
    terraform validate
  displayName: 'Validate Terraform'

- task: Docker@2
  displayName: 'Build and Push Docker Image to ACR'
  inputs:
    command: buildAndPush
    containerRegistry: 'azure-acr-connection'
    repository: 'sharayu-portfolio'
    Dockerfile: 'web/Dockerfile'
    buildContext: 'web'
    tags: |
      $(Build.BuildId)
      latest

- script: |
    echo "Docker image successfully pushed to ACR"
    docker images
  displayName: 'Verify Docker Image'

- task: AzureWebAppContainer@1
  displayName: 'Deploy Container to Azure App Service'
  inputs:
    azureSubscription: 'azure-appservice-connection'
    appName: 'sharayu-azure-devops-app'
    containers: 'sharayuacr.azurecr.io/sharayu-portfolio:$(Build.BuildId)'
